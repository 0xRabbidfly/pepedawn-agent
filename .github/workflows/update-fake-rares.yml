name: Auto-Update Fake Rares Cards

on:
  # Run daily at 12pm UTC
  schedule:
    - cron: '0 12 * * *'
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      series:
        description: 'Series numbers to scrape (space-separated, e.g., "18 19 20")'
        required: false
        default: '18 19 20 21 22 23 24 25'

# The run opens a pull request and merges it itself. Nobody merged these by
# hand for a year, so production served the same index all along. The guards:
# the sync refuses a short API response or a retirement wave, and the index
# integrity test must pass on the file as written. A failed guard fails the
# run visibly and merges nothing.
permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-new-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        working-directory: pepe-tg
        run: |
          bun install
          bunx playwright install --with-deps chromium
      
      # Pass 1 lists cards from the directory's /api/cards (the old /series-N/
      # pages are gone); pass 2 still needs the browser for pepe.wtf.
      - name: Add new Fake Rares cards
        working-directory: pepe-tg
        run: |
          SERIES="${{ github.event.inputs.series || '18 19 20 21 22 23 24 25' }}"
          echo "🔍 Checking series: $SERIES"
          node scripts/add-new-cards.js $SERIES

      # The directory has the last word on artist credits, release dates and
      # which cards exist; pepe.wtf above still supplies current supply, slugs
      # and media details. One request. Refuses to write on a suspicious diff.
      - name: Reconcile with fakeraredirectory.com
        working-directory: pepe-tg
        run: |
          bun scripts/sync-directory.ts | tee "$RUNNER_TEMP/sync-report.txt"
          {
            echo '### Directory sync'
            echo '```'
            cat "$RUNNER_TEMP/sync-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Cards the vision pass has never seen get looked at - a still image,
      # one vision call, one summary call - and their facts committed next to
      # the index. Capped per run. Without the secret it lists and exits 0.
      - name: Look at cards without visual facts
        working-directory: pepe-tg
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          bun scripts/fv-backfill.ts --limit 25 | tee "$RUNNER_TEMP/fv-report.txt"
          {
            echo '### Visual facts'
            echo '```'
            tail -n 5 "$RUNNER_TEMP/fv-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate before anything is merged: the index as written is whole,
      # every card has a slot and a media extension, no slot is shared, and
      # every live card resolves to a URL that is not the dead old site.
      - name: Check the index is fit to serve
        working-directory: pepe-tg
        run: bun test src/__tests__/utils/cardIndexIntegrity.test.ts

      - name: Check for changes
        id: check-changes
        run: |
          git add -N pepe-tg/src/data/card-visual-facts
          if git diff --quiet -- pepe-tg/src/data/fake-rares-data.json pepe-tg/src/data/card-visual-facts pepe-tg/src/data/card-visual-traits.json pepe-tg/src/data/directory-artists.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No new cards found"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            # Cards whose record differs from the committed one, plus cards
            # that vanished. Counting '+ "asset"' lines, as before, missed
            # every artist or release edit and reported 0.
            git show HEAD:pepe-tg/src/data/fake-rares-data.json > "$RUNNER_TEMP/before.json"
            CHANGED=$(bun -e '
              const [before, after] = await Promise.all([Bun.file(process.argv[1]).json(), Bun.file(process.argv[2]).json()]);
              const was = new Map(before.map((c) => [c.asset, JSON.stringify(c)]));
              const now = new Set(after.map((c) => c.asset));
              let n = 0;
              for (const c of after) if (was.get(c.asset) !== JSON.stringify(c)) n++;
              for (const asset of was.keys()) if (!now.has(asset)) n++;
              console.log(n);
            ' "$RUNNER_TEMP/before.json" pepe-tg/src/data/fake-rares-data.json)
            echo "cards_added=${CHANGED}" >> $GITHUB_OUTPUT
            echo "✅ ${CHANGED} cards touched"
          fi
      
      - name: Write the pull request body
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          {
            echo '## 🎴 Fake Rares index updated'
            echo
            echo 'Daily run: cards from fakeraredirectory.com `/api/cards` (canon), supply from pepe.wtf,'
            echo "series checked ${{ github.event.inputs.series || '18-25' }}. Merged by the workflow once the"
            echo 'index integrity test passed. Production picks the file up from master within a day.'
            echo
            echo '### Directory sync report'
            echo '```'
            cat "$RUNNER_TEMP/sync-report.txt"
            echo '```'
            echo
            echo '### Visual facts'
            echo '```'
            tail -n 5 "$RUNNER_TEMP/fv-report.txt"
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create Pull Request
        id: cpr
        if: steps.check-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'data: daily card index update (${{ steps.check-changes.outputs.cards_added }} cards touched)'
          title: '🤖 Daily card index update (${{ steps.check-changes.outputs.cards_added }} cards touched)'
          body-path: ${{ runner.temp }}/pr-body.md
          branch: auto-update-fake-rares
          delete-branch: true
          labels: |
            automated
            data-update

      # Squash so master gets one data: commit per day. If master is ever
      # protected with a required review, this step fails and the PR stays
      # open for a person - the old behaviour, now loud instead of silent.
      - name: Merge the pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch --repo "${{ github.repository }}"

      - name: Summary
        run: |
          if [[ "${{ steps.check-changes.outputs.changed }}" == "true" ]]; then
            echo "✅ Merged PR #${{ steps.cpr.outputs.pull-request-number }} with ${{ steps.check-changes.outputs.cards_added }} card update(s)"
          else
            echo "ℹ️  No card updates - no action needed"
          fi
