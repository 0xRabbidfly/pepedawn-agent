      body: '{\n  "story": "DJPEPE is Series 1, Card 3 — …",\n  "sourcesLine": "card facts · community memory",\n  "card": "DJPEPE",\n  "metrics": {\n    "hits_raw": 24, "hits_used": 6,\n    "clusters": 3, "latency_ms": 2841,\n    "story_words": 96\n  }\n}'
    },
    dispense: {

    },

<script>
(function () {
  "use strict";

  var SVGNS = "http://www.w3.org/2000/svg";
  var TW = 34, TH = 17, HZ = 27;          /* tile half-width, half-height, one height unit */
  var SPREAD = 1.55;                       /* gap multiplier applied to plan coordinates */
  var stage = document.getElementById("stage");
  var canvasEl = document.getElementById("canvas");
  var readerBody = document.getElementById("readerbody");
  var tabsEl = document.getElementById("tabs");
  var crumbsEl = document.getElementById("crumbs");

  var view = { k: 1, x: 0, y: 0 };
  var scene = null;                        /* { title, nodes, edges, isInside } */
  var selected = null;                     /* node id */
  var payloadKey = null;
  var tab = "does";
  var flowing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var travellers = [];                     /* animated dots */
  var root, layerGrid, layerEdges, layerNodes, layerLabels, layerDots;
  var nodeEls = {}, labelEls = {}, edgeEls = [];

  /* ---------------- projection ---------------- */
  function iso(gx, gy, gz) {
    return { x: (gx - gy) * TW, y: (gx + gy) * TH - (gz || 0) * HZ };
  }
  function pts(list) {
    return list.map(function (p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
  }
  function el(name, attrs, parent) {
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) { if (attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]); }
    if (parent) parent.appendChild(n);
    return n;
  }

  /* ---------------- scenes ---------------- */
  function mainScene() {
    var nodes = [];
    Object.keys(ATLAS.nodes).forEach(function (id) {
      var n = ATLAS.nodes[id];
      nodes.push({
        id: id, key: n.key, label: n.label, kind: n.kind,
        gx: n.cell[0] * SPREAD, gy: n.cell[1] * SPREAD, w: n.w, d: n.d, h: n.h, plates: n.plates
      });
    });
    return { title: null, nodes: nodes, edges: ATLAS.edges.slice(), isInside: false, parent: null };
  }

  function insideScene(id) {
    var src = ATLAS.nodes[id];
    var steps = src.inside || [];
    var nodes = [], edges = [];
    steps.forEach(function (s, i) {
      var nid = "s" + i;
      nodes.push({
        id: nid, key: String(i + 1), label: s.t, kind: "core",
        gx: i * 3.5, gy: i * 1.5, w: 2.1, d: 2.1, h: 0.9 + (i % 2 ? 0.45 : 0.1),
        step: s
      });
      if (i > 0) edges.push({ from: "s" + (i - 1), to: nid, label: "", payload: null, kind: "step" });
    });
    return { title: src.label + " — in execution order", nodes: nodes, edges: edges, isInside: true, parent: id };
  }

  /* ---------------- geometry helpers ---------------- */
  function centre(n) { return { gx: n.gx + n.w / 2, gy: n.gy + n.d / 2 }; }

  function route(a, b) {
    var ca = centre(a), cb = centre(b);
    var dx = cb.gx - ca.gx, dy = cb.gy - ca.gy;
    var mid = Math.abs(dx) >= Math.abs(dy)
      ? { gx: cb.gx, gy: ca.gy }
      : { gx: ca.gx, gy: cb.gy };
    var raw = [ca, mid, cb];
    /* drop a redundant corner */
    if (Math.abs(raw[0].gx - raw[1].gx) < 0.01 && Math.abs(raw[0].gy - raw[1].gy) < 0.01) raw.splice(1, 1);
    return raw.map(function (p) { return iso(p.gx, p.gy, 0.12); });
  }

  function pathFrom(points) {
    var d = "M " + points[0].x.toFixed(1) + " " + points[0].y.toFixed(1);
    for (var i = 1; i < points.length; i++) d += " L " + points[i].x.toFixed(1) + " " + points[i].y.toFixed(1);
    return d;
  }

  /* ---------------- drawing ---------------- */
  function drawBox(g, n) {
    var A = iso(n.gx, n.gy, n.h), B = iso(n.gx + n.w, n.gy, n.h),
        C = iso(n.gx + n.w, n.gy + n.d, n.h), D = iso(n.gx, n.gy + n.d, n.h);
    var b0 = iso(n.gx + n.w, n.gy, 0), c0 = iso(n.gx + n.w, n.gy + n.d, 0), d0 = iso(n.gx, n.gy + n.d, 0);
    el("polygon", { points: pts([B, C, c0, b0]), class: "face face-right" }, g);
    el("polygon", { points: pts([B, C, c0, b0]), fill: "url(#hatch)", stroke: "none" }, g);
    el("polygon", { points: pts([C, D, d0, c0]), class: "face face-left" }, g);
    el("polygon", { points: pts([A, B, C, D]), class: "face face-top" }, g);
    return { A: A, B: B, C: C, D: D };
  }

  function drawPlates(g, n) {
    var count = n.plates || 3, thick = 0.26, gap = 0.16;
    for (var i = 0; i < count; i++) {
      var z = i * (thick + gap);
      var A = iso(n.gx, n.gy, z + thick), B = iso(n.gx + n.w, n.gy, z + thick),
          C = iso(n.gx + n.w, n.gy + n.d, z + thick), D = iso(n.gx, n.gy + n.d, z + thick);
      var b0 = iso(n.gx + n.w, n.gy, z), c0 = iso(n.gx + n.w, n.gy + n.d, z), d0 = iso(n.gx, n.gy + n.d, z);
      el("polygon", { points: pts([B, C, c0, b0]), class: "face face-right" }, g);
      el("polygon", { points: pts([C, D, d0, c0]), class: "face face-left" }, g);
      el("polygon", { points: pts([A, B, C, D]), class: "plate face-top face" }, g);
    }
    var topZ = (count - 1) * (thick + gap) + thick;
    return {
      A: iso(n.gx, n.gy, topZ), B: iso(n.gx + n.w, n.gy, topZ),
      C: iso(n.gx + n.w, n.gy + n.d, topZ), D: iso(n.gx, n.gy + n.d, topZ)
    };
  }

  function drawGrid() {
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    scene.nodes.forEach(function (n) {
      minX = Math.min(minX, n.gx); maxX = Math.max(maxX, n.gx + n.w);
      minY = Math.min(minY, n.gy); maxY = Math.max(maxY, n.gy + n.d);
    });
    var pad = 1.6;
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    for (var gx = Math.floor(minX); gx <= Math.ceil(maxX); gx += 2) {
      var p1 = iso(gx, minY, 0), p2 = iso(gx, maxY, 0);
      el("line", { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: "iso-grid" }, layerGrid);
    }
    for (var gy = Math.floor(minY); gy <= Math.ceil(maxY); gy += 2) {
      var q1 = iso(minX, gy, 0), q2 = iso(maxX, gy, 0);
      el("line", { x1: q1.x, y1: q1.y, x2: q2.x, y2: q2.y, class: "iso-grid" }, layerGrid);
    }
  }

  /* ---------------- render ---------------- */
  function render() {
    while (stage.firstChild) stage.removeChild(stage.firstChild);
    nodeEls = {}; labelEls = {}; edgeEls = []; travellers = [];

    var defs = el("defs", {}, stage);
    var hatch = el("pattern", {
      id: "hatch", width: 5, height: 5, patternUnits: "userSpaceOnUse",
      patternTransform: "rotate(35)"
    }, defs);
    el("line", { x1: 0, y1: 0, x2: 0, y2: 5, style: "stroke: var(--rule-faint); stroke-width: 1;" }, hatch);

    root = el("g", { id: "root" }, stage);
    layerGrid = el("g", {}, root);
    layerEdges = el("g", {}, root);
    layerNodes = el("g", {}, root);
    layerLabels = el("g", {}, root);
    layerDots = el("g", {}, root);

    drawGrid();

    var byId = {};
    scene.nodes.forEach(function (n) { byId[n.id] = n; });

    /* edges under the blocks, as in a drafting plan */
    scene.edges.forEach(function (e, i) {
      var a = byId[e.from], b = byId[e.to];
      if (!a || !b) return;
      var points = route(a, b);
      var d = pathFrom(points);
      var p = el("path", { d: d, class: "edge-line" + (e.kind ? " " + e.kind : "") }, layerEdges);
      var end = points[points.length - 1];
      var cap = el("circle", { cx: end.x, cy: end.y, r: 2.4, class: "edge-cap" }, layerEdges);
      var mid = points.length > 2 ? points[1] : {
        x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2
      };
      var lab = e.label ? el("text", { x: mid.x, y: mid.y - 7, class: "edgelabel" }, layerEdges) : null;
      if (lab) lab.textContent = e.label;
      var rec = { edge: e, path: p, cap: cap, label: lab, from: e.from, to: e.to };
      edgeEls.push(rec);

      if (e.payload && !scene.isInside) {
        var len = p.getTotalLength();
        var dot = el("rect", {
          x: -3.6, y: -3.6, width: 7.2, height: 7.2, class: "dot",
          transform: "translate(0,0) rotate(45)"
        }, layerDots);
        var hit = el("circle", { cx: 0, cy: 0, r: 9, class: "dothit" }, layerDots);
        var t = {
          path: p, len: len, pos: (i * 37) % Math.max(len, 1), dot: dot, hit: hit,
          payload: e.payload, edge: rec, speed: 26 + (i % 3) * 6
        };
        travellers.push(t);
        var open = function (ev) { ev.stopPropagation(); showPayload(t.payload, rec); };
        hit.addEventListener("click", open);
        dot.addEventListener("click", open);
      }
    });

    /* blocks, painted back to front so the isometry reads correctly */
    scene.nodes.slice().sort(function (a, b) {
      return (a.gx + a.gy) - (b.gx + b.gy);
    }).forEach(function (n) {
      var g = el("g", {
        class: "node " + (n.kind === "ext" ? "ext" : n.kind),
        tabindex: "0", role: "button",
        "aria-label": n.label
      }, layerNodes);
      var top = n.plates ? drawPlates(g, n) : drawBox(g, n);
      var cx = (top.A.x + top.C.x) / 2, cy = (top.A.y + top.C.y) / 2;
      var k = el("text", { x: cx, y: cy, class: "key" }, g);
      k.textContent = n.key;
      var base = iso(n.gx + n.w / 2, n.gy + n.d / 2, 0);
      var foot = iso(n.gx + n.w, n.gy + n.d, 0);
      var lab = el("text", {
        x: base.x, y: foot.y + 13,
        class: "nodelabel" + (n.step ? " code" : "")
      }, layerLabels);
      lab.textContent = n.label;
      labelEls[n.id] = lab;
      el("polygon", { points: pts([top.A, top.B, top.C, top.D]), class: "hit" }, g);

      g.addEventListener("click", function (ev) { ev.stopPropagation(); select(n.id); });
      g.addEventListener("dblclick", function (ev) { ev.stopPropagation(); goInside(n.id); });
      g.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id); }
      });
      g.addEventListener("mouseenter", function () { highlight(n.id, true); });
      g.addEventListener("mouseleave", function () { highlight(n.id, false); });
      nodeEls[n.id] = g;
    });

    fit();
    applyView();
    paintSelection();
  }

  /* ---------------- camera ---------------- */
  function fit() {
    var bb;
    try { bb = layerNodes.getBBox(); } catch (e) { return; }
    var w = canvasEl.clientWidth, h = canvasEl.clientHeight;
    if (!bb.width || !bb.height || !w || !h) return;
    var k = Math.min(w / (bb.width + 96), h / (bb.height + 108));
    view.k = Math.max(0.28, Math.min(scene && scene.isInside ? 1.0 : 1.9, k));
    view.x = w / 2 - (bb.x + bb.width / 2) * view.k;
    view.y = h / 2 - (bb.y + bb.height / 2) * view.k;
  }
  function applyView() {
    root.setAttribute("transform",
      "translate(" + view.x.toFixed(2) + "," + view.y.toFixed(2) + ") scale(" + view.k.toFixed(3) + ")");
  }
  function zoomAt(cx, cy, factor) {
    var k2 = Math.max(0.25, Math.min(3.2, view.k * factor));
    var r = k2 / view.k;
    view.x = cx - (cx - view.x) * r;
    view.y = cy - (cy - view.y) * r;
    view.k = k2;
    applyView();
  }

  canvasEl.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var rect = canvasEl.getBoundingClientRect();
    zoomAt(ev.clientX - rect.left, ev.clientY - rect.top, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  var drag = null;
  canvasEl.addEventListener("pointerdown", function (ev) {
    if (ev.target.classList && (ev.target.classList.contains("dothit") || ev.target.classList.contains("dot"))) return;
    drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false };
    canvasEl.classList.add("dragging");
    canvasEl.setPointerCapture(ev.pointerId);
  });
  canvasEl.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    view.x = drag.vx + (ev.clientX - drag.x);
    view.y = drag.vy + (ev.clientY - drag.y);
    if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 4) drag.moved = true;
    applyView();
  });
  canvasEl.addEventListener("pointerup", function (ev) {
    if (drag && !drag.moved && ev.target === stage) select(null);
    drag = null;
    canvasEl.classList.remove("dragging");
  });
  window.addEventListener("resize", function () { fit(); applyView(); });

  /* ---------------- flow ---------------- */
  var last = 0;
  function frame(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
    last = ts;
    if (flowing) advance(dt);
    requestAnimationFrame(frame);
  }
  function advance(dt) {
    travellers.forEach(function (t) {
      t.pos = (t.pos + t.speed * dt) % t.len;
      var p = t.path.getPointAtLength(t.pos);
      t.dot.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ") rotate(45)");
      t.hit.setAttribute("cx", p.x.toFixed(1));
      t.hit.setAttribute("cy", p.y.toFixed(1));
    });
  }
  requestAnimationFrame(frame);

  /* ---------------- selection & highlighting ---------------- */
  function highlight(id, on) {
    edgeEls.forEach(function (r) {
      var touches = r.from === id || r.to === id;
      r.path.classList.toggle("lit", on && touches);
      r.cap.classList.toggle("lit", on && touches);
      if (r.label) r.label.classList.toggle("lit", on && touches);
    });
  }

  function paintSelection() {
    Object.keys(nodeEls).forEach(function (id) {
      nodeEls[id].classList.toggle("sel", id === selected);
      if (labelEls[id]) labelEls[id].classList.toggle("sel", id === selected);
    });
    var rows = document.querySelectorAll(".idx-row");
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle("active", rows[i].dataset.id === selected);
    }
    if (selected) highlight(selected, true);
    else edgeEls.forEach(function (r) {
      r.path.classList.remove("lit"); r.cap.classList.remove("lit");
      if (r.label) r.label.classList.remove("lit");
    });
  }

  function select(id) {
    selected = id;
    if (id && tab === "payload") tab = "does";
    paintSelection();
    paintCrumbs();
    paintReader();
  }

  function showPayload(key, edgeRec) {
    payloadKey = key;
    tab = "payload";
    if (edgeRec) {
      edgeEls.forEach(function (r) {
        r.path.classList.toggle("lit", r === edgeRec);
        r.cap.classList.toggle("lit", r === edgeRec);
        if (r.label) r.label.classList.toggle("lit", r === edgeRec);
      });
    }
    paintTabs();
    paintReader();
  }

  /* ---------------- inside view ---------------- */
  function goInside(id) {
    var n = ATLAS.nodes[id];
    if (!n || !n.inside || !n.inside.length) return;
    scene = insideScene(id);
    selected = null;
    render();
    paintCrumbs();
    paintReader();
  }
  function comeBackOut() {
    var parent = scene.parent;
    scene = mainScene();
    selected = parent || null;
    render();
    paintCrumbs();
    paintReader();
  }

  /* ---------------- chrome ---------------- */
  function h(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function paintTitleBlock() {
    var tb = document.getElementById("titleblock");
    var html = '<div class="tb-cell"><span class="tb-label">Repository</span>' +
      '<span class="tb-value">' + h(ATLAS.meta.repo) + '</span></div>';
    ATLAS.meta.stats.forEach(function (s) {
      html += '<div class="tb-cell"><span class="tb-label">' + h(s.label) + '</span>' +
        '<span class="tb-value">' + h(s.value) + '</span></div>';
    });
    html += '<div class="tb-controls">' +
      '<button type="button" id="flow">' + (flowing ? "Pause the flow" : "Resume the flow") + '</button>' +
      '<button type="button" id="step">Trace one step</button>' +
      '<button type="button" id="reset">Reset view</button></div>';
    tb.innerHTML = html;
    document.getElementById("flow").addEventListener("click", function () {
      flowing = !flowing;
      this.textContent = flowing ? "Pause the flow" : "Resume the flow";
      this.classList.toggle("on", !flowing);
    });
    document.getElementById("step").addEventListener("click", function () {
      flowing = false;
      var f = document.getElementById("flow");
      f.textContent = "Resume the flow"; f.classList.add("on");
      travellers.forEach(function (t) { t.pos = (t.pos + t.len * 0.09) % t.len; });
      advance(0);
    });
    document.getElementById("reset").addEventListener("click", function () { fit(); applyView(); });
  }

  function paintIndex() {
    var idx = document.getElementById("index");
    var html = "";
    ATLAS.groups.forEach(function (grp) {
      html += '<h2>' + h(grp.title) + '</h2>';
      grp.ids.forEach(function (id) {
        var n = ATLAS.nodes[id];
        if (!n) return;
        var count = n.loc ? (n.loc >= 1000 ? (n.loc / 1000).toFixed(1) + "k" : n.loc) : "—";
        html += '<button type="button" class="idx-row" data-id="' + id + '">' +
          '<span class="k">' + h(n.key) + '</span>' +
          '<span>' + h(n.label) + '</span>' +
          '<span class="n">' + count + '</span></button>';
      });
    });
    idx.innerHTML = html;
    idx.addEventListener("click", function (ev) {
      var row = ev.target.closest(".idx-row");
      if (!row) return;
      if (scene.isInside) { scene = mainScene(); render(); }
      select(row.dataset.id);
      centreOn(row.dataset.id);
    });
  }

  function centreOn(id) {
    var n = null;
    scene.nodes.forEach(function (x) { if (x.id === id) n = x; });
    if (!n) return;
    var p = iso(n.gx + n.w / 2, n.gy + n.d / 2, 0);
    view.x = canvasEl.clientWidth / 2 - p.x * view.k;
    view.y = canvasEl.clientHeight / 2 - p.y * view.k;
    applyView();
  }

  function paintCrumbs() {
    var html = "";
    if (scene.isInside) {
      html = '<button type="button" id="back">← Come back out</button>' +
        '<span class="here">' + h(ATLAS.nodes[scene.parent].label) + '</span>';
    } else if (selected && ATLAS.nodes[selected] && ATLAS.nodes[selected].inside) {
      html = '<button type="button" id="in">Go inside ' + h(ATLAS.nodes[selected].key) + ' →</button>';
    }
    crumbsEl.innerHTML = html;
    var back = document.getElementById("back");
    if (back) back.addEventListener("click", comeBackOut);
    var into = document.getElementById("in");
    if (into) into.addEventListener("click", function () { goInside(selected); });
  }

  function paintTabs() {
    var btns = tabsEl.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-selected", btns[i].dataset.tab === tab ? "true" : "false");
    }
  }
  tabsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    tab = b.dataset.tab;
    paintTabs();
    paintReader();
  });

  function introHTML(which) {
    var m = ATLAS.meta;
    var html = '<p class="eyebrow">' + h(m.short || m.repo) + ' · v' + h(m.version) + '</p>' +
      '<h1>' + h(m.title) + '</h1>' +
      '<p class="sub">' + h(m.subtitle) + '</p>';
    (m.intro[which] || []).forEach(function (sec) {
      html += '<h3>' + h(sec.h) + '</h3>';
      sec.p.forEach(function (p) { html += '<p>' + p + '</p>'; });
    });
    return html;
  }

  function nodeHTML(id, which) {
    var n = ATLAS.nodes[id];
    var html = '<p class="eyebrow">' + h(n.key) + ' · ' + (n.kind === "ext" ? "outside the process" : n.kind === "store" ? "at rest" : "structure") + '</p>' +
      '<h1>' + h(n.label) + '</h1>';
    if (n.tag) html += '<p class="sub">' + h(n.tag) + '</p>';

    if (which === "does") {
      html += '<h3>What it does</h3><p>' + n.does + '</p>';
      html += '<h3>Facts</h3><dl class="meta">';
      if (n.loc) html += '<dt>Lines</dt><dd>' + n.loc.toLocaleString() + '</dd>';
      html += '<dt>Files</dt><dd>' + (n.files.length || "—") + '</dd>';
      var ins = ATLAS.edges.filter(function (e) { return e.to === id; });
      var outs = ATLAS.edges.filter(function (e) { return e.from === id; });
      html += '<dt>Fed by</dt><dd>' + (ins.map(function (e) { return ATLAS.nodes[e.from].label; }).join(", ") || "—") + '</dd>';
      html += '<dt>Feeds</dt><dd>' + (outs.map(function (e) { return ATLAS.nodes[e.to].label; }).join(", ") || "—") + '</dd>';
      html += '</dl>';
      if (n.files.length) {
        html += '<h3>Where it lives</h3><ul class="filelist">';
        n.files.forEach(function (f) {
          html += '<li><span>' + h(f.p) + '</span><span class="loc">' + f.n.toLocaleString() + '</span></li>';
        });
        html += '</ul>';
      }
      if (outs.length) {
        html += '<h3>What moves out of it</h3>';
        outs.forEach(function (e) {
          if (!e.payload) return;
          html += '<button type="button" class="pill hot" data-payload="' + e.payload + '">' + h(e.label) + '</button>';
        });
      }
    } else {
      html += '<h3>How it is built</h3><p>' + n.built + '</p>';
      if (n.condition) html += '<h3>Condition</h3><p class="warn">' + n.condition + '</p>';
      if (n.inside) {
        html += '<h3>Inside, in order</h3><ol class="steps">';
        n.inside.forEach(function (s) {
          html += '<li><div><b>' + h(s.t) + '</b><span>' + h(s.d) + '</span></div></li>';
        });
        html += '</ol>';
      }
    }
    return html;
  }

  function payloadHTML() {
    if (!payloadKey) {
      return '<p class="eyebrow">Payload</p><h1>Nothing picked up yet</h1>' +
        '<p>The dots moving along the lines are real payloads — router decisions, token receipts, cadence verdicts, chain events — taken from the JSONL telemetry in <code>src/data/</code>. Click one and it lands here.</p>';
    }
    var p = ATLAS.payloads[payloadKey];
    return '<p class="eyebrow">Payload in flight</p><h1>' + h(p.title) + '</h1>' +
      '<p class="sub">' + h(p.src) + '</p>' +
      '<h3>As written</h3><pre>' + h(p.body) + '</pre>' +
      '<h3>Why it looks like this</h3><p>' + p.note + '</p>';
  }

  function stepHTML(id) {
    var n = null;
    scene.nodes.forEach(function (x) { if (x.id === id) n = x; });
    if (!n) return nodeHTML(scene.parent, tab);
    var parent = ATLAS.nodes[scene.parent];
    var i = scene.nodes.indexOf(n) + 1;
    return '<p class="eyebrow">' + h(parent.label) + ' · step ' + i + ' of ' + scene.nodes.length + '</p>' +
      '<h1>' + h(n.label) + '</h1>' +
      '<h3>What happens here</h3><p>' + h(n.step.d) + '</p>' +
      '<h3>Where it lives</h3><ul class="filelist">' +
      parent.files.map(function (f) {
        return '<li><span>' + h(f.p) + '</span><span class="loc">' + f.n.toLocaleString() + '</span></li>';
      }).join("") + '</ul>';
  }

  function paintReader() {
    if (tab === "payload") readerBody.innerHTML = payloadHTML();
    else if (scene.isInside && selected) readerBody.innerHTML = stepHTML(selected);
    else if (scene.isInside) readerBody.innerHTML = nodeHTML(scene.parent, tab);
    else if (selected && ATLAS.nodes[selected]) readerBody.innerHTML = nodeHTML(selected, tab);
    else readerBody.innerHTML = introHTML(tab);
    readerBody.scrollTop = 0;
    paintTabs();
  }

  readerBody.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-payload]");
    if (b) showPayload(b.dataset.payload, null);
  });

  /* ---------------- keyboard ---------------- */
  document.addEventListener("keydown", function (ev) {
    if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
    if (ev.key === "Escape") {
      if (scene.isInside) comeBackOut();
      else select(null);
    } else if (ev.key === " ") {
      ev.preventDefault();
      document.getElementById("flow").click();
    } else if (ev.key === ".") {
      document.getElementById("step").click();
    } else if (ev.key === "ArrowLeft") { view.x += 60; applyView(); }
    else if (ev.key === "ArrowRight") { view.x -= 60; applyView(); }
    else if (ev.key === "ArrowUp") { view.y += 60; applyView(); }
    else if (ev.key === "ArrowDown") { view.y -= 60; applyView(); }
  });

  document.getElementById("zin").addEventListener("click", function () {
    zoomAt(canvasEl.clientWidth / 2, canvasEl.clientHeight / 2, 1.2);
  });
  document.getElementById("zout").addEventListener("click", function () {
    zoomAt(canvasEl.clientWidth / 2, canvasEl.clientHeight / 2, 1 / 1.2);
  });

  /* ---------------- boot ---------------- */
  paintTitleBlock();
  paintIndex();
  scene = mainScene();
  render();
  paintCrumbs();
  paintReader();
  window.__atlas = {
    select: select, goInside: goInside, showPayload: showPayload,
    tab: function (t) { tab = t; paintTabs(); paintReader(); }
  };
  if (!flowing) {
    var f = document.getElementById("flow");
    f.textContent = "Resume the flow";
    f.classList.add("on");
  }
})();
</script>
